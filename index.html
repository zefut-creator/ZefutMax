<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="ZefutMax — демо-интерфейс каталога Telegram Gifts. Реальные покупки и передача подарков пока не подключены.">
<meta name="color-scheme" content="dark light">
<title>ZefutMax — Gift Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#050505;--panel:#101010;--panel2:#191919;
  --line:#303030;--text:#f7f7f7;--muted:#a3a3a3;
  --accent:#b18cff;--green:#4ce0a0;--red:#ff8193;
  --gradient:linear-gradient(135deg,#9b5de5,#ff8a00);
  --shadow:0 12px 32px #0003
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f5fb;--panel:#ffffff;--panel2:#f0eaf8;
  --line:#ded6e8;--text:#21162b;--muted:#716879;
  --accent:#8b45d6;--green:#16865b;--red:#c83756;
  --gradient:linear-gradient(135deg,#9b5de5,#ff8a00);
  --shadow:0 12px 32px #4b286010
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  min-height:100vh
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
header{
  position:sticky;top:0;z-index:5;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(16px);
  padding:calc(12px + env(safe-area-inset-top)) 15px 10px;
  border-bottom:1px solid var(--line)
}
.wrap{max-width:1000px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:43px;height:43px;border-radius:14px;
  background:var(--gradient);display:grid;place-items:center;font-size:24px
}
h1{font-size:20px;letter-spacing:-.5px;margin:0}
.subhead{font-size:11px;color:var(--muted)}
.topactions{display:flex;align-items:center;gap:7px}
.iconbtn,.balance{
  border:1px solid var(--line);background:var(--panel);
  color:var(--text);border-radius:13px;padding:9px 11px
}
.iconbtn{width:40px;height:40px;font-size:17px}
.balance{border-radius:999px;font-weight:800;white-space:nowrap}
.balance strong{color:var(--accent)}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:13px}
.searchbox{position:relative;min-width:0}
.searchbox span{position:absolute;left:12px;top:9px;color:var(--muted)}
input,select{
  min-width:0;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px
}
#q{width:100%;padding-left:34px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip,.tab{
  border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:999px;padding:8px 12px;
  font-size:12px;white-space:nowrap
}
.chip.active,.tab.active{
  border-color:var(--accent);background:var(--panel2);color:var(--accent)
}
main{max-width:1000px;margin:auto;padding:18px 15px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.sectionhead h2{font-size:17px;margin:0}
.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{
  min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:9px;display:flex;flex-direction:column;
  transition:transform .15s,border-color .15s
}
.card:active{transform:scale(.985)}
.art{
  position:relative;aspect-ratio:1;border-radius:13px;
  display:grid;place-items:center;overflow:hidden;font-size:50px;
  background:radial-gradient(circle at 25% 15%,#ffffff20,transparent 40%),
  linear-gradient(145deg,#171717,#ff8a00 120%)
}
.art.c1{background:linear-gradient(145deg,#111,#ff8a00)}
.art.c2{background:linear-gradient(145deg,#242424,#b85b00)}
.art.c3{background:linear-gradient(145deg,#ffad1f,#202020)}
.emoji{filter:drop-shadow(0 5px 7px #0002)}
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px}
.cardtop b{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.fav{border:0;background:transparent;color:var(--muted);font-size:22px;padding:0 2px}
.fav.on{color:var(--red)}
.muted{font-size:11px;color:var(--muted)}
.change{font-size:11px;font-weight:750}
.up{color:var(--green)}.down{color:var(--red)}
.price{font-size:16px;font-weight:850;margin:8px 0}
.price small{font-size:10px;color:var(--muted);font-weight:500}
.btn{
  width:100%;padding:10px 12px;border:0;border-radius:12px;
  background:var(--gradient);color:#35132b;font-weight:850;
  transition:filter .15s,transform .15s
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.card .btn{margin-top:auto}
.note{font-size:11px;line-height:1.55;color:var(--muted);margin:18px 2px}
.demo-banner{max-width:1000px;margin:12px auto 0;padding:10px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);font-size:12px;color:var(--muted)}
.demo-banner strong{color:var(--accent)}
.demo-banner .demo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}
@media(max-width:1030px){.demo-banner{margin-left:15px;margin-right:15px}}
.empty{border:1px dashed var(--line);border-radius:18px;text-align:center;padding:38px 20px;color:var(--muted)}
.empty .big{font-size:35px;margin-bottom:8px}
.listrow{
  display:flex;align-items:center;gap:11px;background:var(--panel);
  border:1px solid var(--line);border-radius:15px;padding:9px;margin-bottom:9px
}
.listrow .art{width:60px;flex:none;font-size:29px}
.listrow .info{flex:1;min-width:0}
.listrow .info b{display:block;font-size:13px}
.listrow .actions{display:flex;flex-direction:column;gap:6px;min-width:85px}
.listrow .btn{font-size:12px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:15px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.stat .label{font-size:11px;color:var(--muted)}
.stat strong{display:block;font-size:16px;margin-top:4px;overflow-wrap:anywhere}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}
.tab{border-radius:11px}
nav{
  position:fixed;z-index:8;bottom:0;left:0;right:0;
  display:flex;justify-content:center;gap:8px;
  background:var(--panel);background:color-mix(in srgb,var(--panel) 95%,transparent);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom))
}
nav button{
  flex:1;max-width:440px;border:0;background:transparent;color:var(--muted);
  border-radius:12px;padding:7px 5px;font-size:12px;font-weight:750
}
nav button .ico{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}
nav button.active{background:var(--panel2);color:var(--accent)}
#overlay{
  position:fixed;inset:0;background:#09030fbb;z-index:20;
  display:none;align-items:flex-end;justify-content:center;padding-top:25px
}
#overlay.open{display:flex}
.sheet{
  width:100%;max-width:540px;max-height:88dvh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);
  border-radius:23px 23px 0 0;padding:19px 17px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow)
}
.handle{width:40px;height:4px;background:var(--line);border-radius:5px;margin:-5px auto 16px}
.sheet .art{width:96px;margin:0 auto 12px}
.sheet h2{text-align:center;font-size:20px;margin:0}
.sheet .desc{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 16px}
.sheet .btn{margin-top:8px}
.sheet .inputlabel{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.sheet input{width:100%}
.summary{background:var(--panel2);border-radius:13px;padding:12px;margin:12px 0;font-size:13px}
.summary div{display:flex;justify-content:space-between;gap:10px;margin:5px 0}
.toast{
  position:fixed;z-index:30;left:50%;top:calc(80px + env(safe-area-inset-top));
  transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:750;font-size:13px;
  box-shadow:var(--shadow);display:none;max-width:90%;text-align:center
}
.toast.show{display:block}
.history{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13px}
.history .detail{color:var(--muted);font-size:11px;margin-top:3px}
.history .amount{font-weight:800;white-space:nowrap}
.positive{color:var(--green)}.negative{color:var(--red)}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{padding:10px}.cardtop b{font-size:14px}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}header{padding-left:22px;padding-right:22px}main{padding-left:22px;padding-right:22px}}
@media(max-width:380px){.balance{padding:8px;font-size:12px}.logo{width:38px;height:38px}.brand{gap:7px}h1{font-size:18px}.listrow .art{width:48px}.listrow .actions{min-width:75px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ZefutMax UI polish */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
body{
  background:
    radial-gradient(ellipse at 50% -15%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 48%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
header{box-shadow:0 8px 28px #00000008}
.brand .logo{
  box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 24%,transparent);
  position:relative;isolation:isolate
}
.brand .logo:after{
  content:"";position:absolute;inset:-3px;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
  border-radius:17px;z-index:-1
}
.iconbtn,.balance,.chip,.tab,nav button,.fav,.btn{
  transition:background-color .18s var(--ease),border-color .18s var(--ease),
    color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s var(--ease)
}
.iconbtn:hover,.balance:hover,.chip:hover,.tab:hover{border-color:var(--accent)}
.card{
  position:relative;overflow:hidden;
  box-shadow:0 5px 16px #00000008;
  animation:card-enter .28s var(--ease) both
}
.card:after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  border:1px solid transparent;transition:border-color .18s var(--ease)
}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 12px 26px #00000016}
.card:hover:after{border-color:color-mix(in srgb,var(--accent) 20%,transparent)}
.art{
  isolation:isolate;
  background-color:var(--panel2);
}
.art:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(circle at 25% 15%,#ffffff38,transparent 42%),
    linear-gradient(145deg,#111,#ff8a00 125%)
}
.art .emoji{transition:transform .22s var(--ease)}
.card:hover .art .emoji{transform:translateY(-2px) scale(1.06)}
.price{letter-spacing:-.25px}
.btn{box-shadow:0 4px 12px #0000000b}
.btn:not(:disabled):hover{filter:brightness(1.06);box-shadow:0 7px 18px #00000018}
.btn.secondary:hover{border-color:var(--accent);background:var(--panel2)}
.fav:hover{transform:scale(1.12)}
.filters{scroll-padding-inline:15px}
.chip, .tab{min-height:36px}
input,select{transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);outline:none}
#overlay{backdrop-filter:blur(5px);opacity:0;transition:opacity .18s var(--ease)}
#overlay.open{opacity:1}
.sheet{animation:sheet-enter .24s var(--ease) both}
.summary{border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
nav{box-shadow:0 -8px 28px #0000000b}
nav button{min-height:54px}
nav button:active{transform:scale(.97)}
.empty{background:color-mix(in srgb,var(--panel) 48%,transparent)}
.demo-banner{box-shadow:0 5px 18px #00000008}
.catalog-section{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.catalog-card .btn{margin-top:auto}
.catalog-card .muted{overflow-wrap:anywhere}
.catalog-card .cardtop{min-height:34px}
.market-section .empty{margin-bottom:18px}
@keyframes card-enter{from{opacity:.75;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheet-enter{from{transform:translateY(14px);opacity:.8}to{transform:translateY(0);opacity:1}}
@media(hover:none){.card:hover{transform:none;box-shadow:0 5px 16px #00000008}.card:hover .art .emoji{transform:none}}
@media(prefers-reduced-motion:reduce){
  .card,.sheet{animation:none!important}
  #overlay{transition:none!important}
}


/* Unified purple-orange identity in both themes */
.logo{background:var(--gradient);border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;color:#fff}
:root[data-theme="light"] .logo{background:var(--gradient);border-color:#8b45d6}
:root[data-theme="light"] .hub-banner,:root[data-theme="light"] .profile-hero{background:linear-gradient(120deg,#fff,#f0eaf8)}
:root[data-theme="light"] .gameicon{background:#f0eaf8}
:root[data-theme="light"] .gameboard .gamecell{background:#fff;border-color:#ded6e8;color:#8b45d6}
:root[data-theme="light"] .rocket-stage,:root[data-theme="light"] .pvp-box{background:#fff}
:root[data-theme="light"] .art:before{background:radial-gradient(circle at 25% 15%,#ffffff90,transparent 42%),linear-gradient(145deg,#eee5f8,#ffb15c 125%)}
.btn{color:#080808}
.hub-banner{display:flex;align-items:center;gap:14px;padding:17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(110deg,#171717,#0b0b0b);margin-bottom:14px}
.hub-orb{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#ff8a00;color:#080808;font-size:27px}
.gamecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gamecard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:9px;padding:13px 11px;min-height:170px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:17px}
.gamecard:hover{border-color:var(--accent);transform:translateY(-2px)}
.gameicon{font-size:29px;width:48px;height:48px;display:grid;place-items:center;background:#1c1c1c;border-radius:14px}
.game-open{margin-top:auto;color:var(--accent);font-size:12px;font-weight:800}
.gameboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0}
.gamecell{aspect-ratio:1;border-radius:12px;border:1px solid #3a3a3a;background:#181818;color:var(--accent);font-weight:900;font-size:20px}
.gamecell.revealed{background:#262626}
.rocket-stage{margin:16px 0;padding:28px 15px;text-align:center;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 20%,#ff8a0022,transparent 65%),#101010}
.rocket-icon{font-size:55px;margin-bottom:10px;display:inline-block}.rocket-icon.flying{animation:rocket-lift .38s ease-in-out infinite alternate}.rocket-mult{font-size:34px;color:var(--accent);font-weight:900;margin-top:12px}.rocket-sub{font-size:12px;color:var(--muted);margin-top:8px}@keyframes rocket-lift{from{transform:translate(0,4px) rotate(-4deg)}to{transform:translate(5px,-12px) rotate(5deg)}}
.pvp-box{display:flex;align-items:center;justify-content:space-around;gap:12px;padding:25px 12px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
.fighter{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:32px}.fighter b{font-size:12px}.fighter strong{font-size:25px;color:var(--accent)}.versus{font-weight:900;color:var(--muted)}
@media(max-width:430px){.gamecards{grid-template-columns:1fr}.gamecard{min-height:unset;display:grid;grid-template-columns:48px 1fr;align-items:center}.gamecard .muted,.game-open{grid-column:2}.gameicon{grid-row:1/4}}

.profile-hero{display:flex;align-items:center;gap:15px;padding:19px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(120deg,#171717,#0b0b0b);margin-bottom:14px;min-width:0}
.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex:none}
.profile-placeholder{display:grid;place-items:center;background:#222;font-size:34px}
.profile-name{min-width:0;overflow-wrap:anywhere}.profile-name h2{font-size:21px;margin:0 0 4px}
.profile-id{font-size:10px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}
nav button{min-width:0;font-size:11px}
@media(max-width:390px){nav{gap:2px;padding-left:4px;padding-right:4px}nav button{font-size:10px;padding-left:1px;padding-right:1px}nav button .ico{font-size:18px}}

/* Premium motion polish across every mode */
:root{--ease-out:cubic-bezier(.2,.75,.25,1);--ease-spring:cubic-bezier(.2,1.35,.4,1)}
html{scroll-behavior:smooth}
button,.btn,.navitem,.gamecard,.giftcard,.card,.chip,.filterbtn,.gamecell,.fav{transition:transform .2s var(--ease-out),box-shadow .22s ease,background-color .22s ease,border-color .22s ease,color .2s ease,opacity .2s ease}
button:active,.btn:active,.navitem:active,.gamecard:active,.giftcard:active,.card:active,.chip:active,.filterbtn:active,.gamecell:active,.fav:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.grid{perspective:900px}
.grid>*{animation:premium-card-in .42s var(--ease-out) both;animation-delay:calc(min(var(--i,0),12)*24ms)}
.grid>*:hover{transform:translateY(-4px);box-shadow:0 14px 35px #0002}
.sectionhead{animation:premium-slide-in .32s var(--ease-out) both}
.summary,.profile-hero,.hub-banner,.rocket-stage,.pvp-box,.note{animation:premium-fade-up .4s var(--ease-out) both}
.gameboard{perspective:800px}
.gamecell{position:relative;overflow:hidden;transform-style:preserve-3d}
.gamecell:not(:disabled):hover{transform:translateY(-3px) rotateX(5deg);box-shadow:0 8px 18px #0003}
.gamecell.revealed{animation:premium-cell-reveal .35s var(--ease-spring) both}
.gamecell:disabled{opacity:.84}
.rocket-stage{position:relative;overflow:hidden}
.rocket-stage:after{content:"";position:absolute;inset:-70% -30%;pointer-events:none;background:linear-gradient(110deg,transparent 42%,#ffffff12 50%,transparent 58%);transform:translateX(-65%);animation:premium-shine 5s ease-in-out infinite}
.rocket-icon{filter:drop-shadow(0 7px 10px #ff8a0030);transition:transform .3s var(--ease-out),filter .3s ease}
.rocket-icon.flying{filter:drop-shadow(0 0 18px #ff8a00aa)}
.rocket-mult{font-variant-numeric:tabular-nums;text-shadow:0 0 24px #ff8a0030;transition:color .2s ease,transform .2s ease}
.pvp-box{position:relative}
.fighter{transition:transform .25s var(--ease-spring)}
.btn:not(:disabled):hover{box-shadow:0 7px 22px #ff8a002b}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip:hover,.filterbtn:hover{transform:translateY(-1px)}
.fav.on{animation:premium-heart-pop .28s var(--ease-spring)}
.toast{animation:premium-toast-in .25s var(--ease-out) both}
.sheet{animation:premium-sheet-in .25s var(--ease-out) both}
.art{transition:transform .3s var(--ease-out),filter .3s ease}
.card:hover .art,.giftcard:hover .art{transform:scale(1.025)}
nav button.active{animation:premium-nav-pop .22s var(--ease-spring)}
@keyframes premium-card-in{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes premium-fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes premium-slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes premium-cell-reveal{0%{transform:rotateY(85deg) scale(.85);opacity:.4}70%{transform:rotateY(-8deg) scale(1.03)}100%{transform:rotateY(0) scale(1);opacity:1}}
@keyframes premium-shine{0%,70%{transform:translateX(-65%)}100%{transform:translateX(65%)}}

const SUPABASE_URL = 'https://pfmoxznzegwqjunayvph.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zvdqQkAzOl9wTVE9E5SeCw_29U0CYOC';
const SUPABASE_TABLE = 'market_listings';
const SHARED_MIGRATION_KEY = 'zefutmax_shared_migrated_v1';
const sellerId = (() => {
  const telegramId = tg?.initDataUnsafe?.user?.id;
  if (telegramId) return 'tg:' + String(telegramId);
  let id = localStorage.getItem('zefutmax_seller_id');
  if (!id) {
    id = 'web:' + (crypto?.randomUUID?.() || (Date.now() + '-' + Math.random().toString(36).slice(2)));
    localStorage.setItem('zefutmax_seller_id', id);
  }
  return id;
})();
const supabaseHeaders = () => ({
  apikey: SUPABASE_KEY,
  Authorization: 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
});
async function sharedRequest(path, options={}) {
  const response = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {...supabaseHeaders(), ...(options.headers||{})}
  });
  if (!response.ok) throw new Error('Supabase ' + response.status + ': ' + (await response.text()).slice(0,180));
  return response.status === 204 ? null : response.json().catch(()=>null);
}
async function publishSharedListing(giftIndex, serial, price) {
  const rows = await sharedRequest(SUPABASE_TABLE, {
    method:'POST',
    headers:{Prefer:'return=representation'},
    body:JSON.stringify({gift_name:gifts[giftIndex][1],price:round(price),seller_id:sellerId})
  });
  return Array.isArray(rows) && rows[0] ? rows[0] : null;
}
async function refreshSharedWallet() {
  try {
    const rows = await sharedRequest('wallet_balances?select=balance&user_id=eq.' + encodeURIComponent(sellerId));
    if (Array.isArray(rows) && rows.length) state.bal = round(rows[0].balance);
    const owned = await sharedRequest('owned_gifts?select=id,gift_name,serial,purchase_price&owner_id=eq.' + encodeURIComponent(sellerId) + '&order=id.desc');
    if (Array.isArray(owned)) {
      const serverMine = owned.map(row => {
        const gi = gifts.findIndex(g => g[1] === row.gift_name);
        return gi < 0 ? null : {id: -Number(row.id), dbId:row.id, g:gi, n:Number(row.serial)||Number(row.id), buy:round(row.purchase_price||0), shared:true};
      }).filter(Boolean);
      state.mine = [...state.mine.filter(x=>!x.shared), ...serverMine];
    }
    save();
  } catch (e) { console.warn('Shared wallet unavailable:', e); }
}
async function refreshSharedListings() {
  try {
    const rows = await sharedRequest(SUPABASE_TABLE + '?select=id,gift_name,serial,price,seller_id,created_at&order=created_at.desc');
    if (!Array.isArray(rows)) return;
    const shared = rows.map(row => {
      const giftIndex = gifts.findIndex(g => g[1] === row.gift_name);
      if (giftIndex < 0) return null;
      return {id:'sb-'+row.id,dbId:row.id,g:giftIndex,n:Number(row.serial)||Number(row.id),p:round(row.price),own:String(row.seller_id)===sellerId,shared:true};
    }).filter(Boolean);
    // Preserve the user's local drafts, but never auto-publish them during polling.
    // The explicit create_market_listing RPC is the only publishing path.
    const drafts = state.mk.filter(x => x.own === true && !x.shared && !x.dbId);
    state.mk = [...shared, ...drafts];
    save();
    if (tab === 'market' || tab === 'mine') render();
  } catch (e) {
    console.warn('Shared market unavailable:', e);
    if (!window.__zefutSharedToastShown) {
      window.__zefutSharedToastShown = true;
      toast('Общий маркет пока не подключён: проверь настройки Supabase');
    }
  }
}

}[c]));

function seed(){return {bal:500,mine:[{id:1000,g:39,n:4521,buy:6.33}],mk:[],nid:1001,favs:[],history:[],theme:'dark'};}
function validState(x){
 if(!x||!Number.isFinite(x.bal)||x.bal<0||!Array.isArray(x.mk)||!Array.isArray(x.mine)||!Array.isArray(x.favs)||!Array.isArray(x.history)||!['dark','light'].includes(x.theme)||!Number.isFinite(x.nid))return false;
 const validGift=g=>Number.isInteger(g)&&g>=0&&g<gifts.length;
 const validListing=item=>item&&(Number.isFinite(item.id)||typeof item.id==='string')&&validGift(item.g)&&Number.isFinite(item.n)&&Number.isFinite(item.p)&&item.p>0;
 return x.mk.every(item=>validListing(item)&&(item.own===undefined||typeof item.own==='boolean'))&&x.mine.every(item=>item&&Number.isFinite(item.id)&&validGift(item.g)&&Number.isFinite(item.n))&&x.favs.every(validGift)&&x.history.every(item=>item&&typeof item.name==='string'&&Number.isFinite(item.amount)&&Number.isFinite(item.at));
}
function load(){
 try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const saved=JSON.parse(raw);if(validState(saved)){const merged=Object.assign(seed(),saved);merged.mk=merged.mk.filter(item=>item.shared===true||item.own===true);return merged;}}}catch(e){}
 return seed();
}
state=load();
function save(){
 if(state&&Number.isFinite(state.bal))state.bal=Math.max(0,round(state.bal));
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('Не удалось сохранить данные на устройстве');}
}

function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2300);
}

    if(type==='success'||type==='error') tg.HapticFeedback.notificationOccurred(type);

  }catch(e){}
}

function renderMarket(){
 let listings=state.mk.filter(x=>gifts[x.g][1].toLowerCase().includes(search)||String(x.n).includes(search));
 if(filter==='up')listings=listings.filter(x=>gifts[x.g][3]>0);
 if(filter==='down')listings=listings.filter(x=>gifts[x.g][3]<0);
 if(filter==='fav')listings=listings.filter(x=>state.favs.includes(x.g));
 listings.sort((a,b)=>sort==='priceDown'?b.p-a.p:sort==='growth'?(gifts[b.g][3]-gifts[a.g][3]||a.p-b.p):sort==='name'?gifts[a.g][1].localeCompare(gifts[b.g][1]):a.p-b.p);
 let catalog=gifts.map((g,i)=>i).filter(i=>{const g=gifts[i];if(!(g[1].toLowerCase().includes(search)||String(i+1).includes(search)))return false;if(filter==='up'&&g[3]<=0)return false;if(filter==='down'&&g[3]>=0)return false;if(filter==='fav'&&!state.favs.includes(i))return false;return true;});
 catalog.sort((a,b)=>sort==='priceDown'?gifts[b][2]-gifts[a][2]:sort==='growth'?(gifts[b][3]-gifts[a][3]||gifts[a][2]-gifts[b][2]):sort==='name'?gifts[a][1].localeCompare(gifts[b][1]):gifts[a][2]-gifts[b][2]);
 return '<section class="market-section"><div class="sectionhead"><div><h2>Объявления маркета</h2><div class="muted">Лоты из общей базы</div></div><span class="count">'+listings.length+' лотов</span></div>'+(listings.length?'<div class="grid">'+listings.map(card).join('')+'</div>':empty('🛍️','Пока нет активных лотов','Каталог ниже доступен в демо-режиме.'))+'</section><section class="catalog-section"><div class="sectionhead"><div><h2>Каталог подарков</h2><div class="muted">Коллекция демонстрационных моделей</div></div><span class="count">'+catalog.length+' из '+gifts.length+'</span></div>'+(catalog.length?'<div class="grid">'+catalog.map(catalogCard).join('')+'</div>':empty('🔎','Ничего не найдено','Измени запрос или фильтр.'))+'<p class="note">Каталог и цены демонстрационные. Добавление здесь бесплатное и меняет только локальную демо-коллекцию. Реальные покупки и передача Telegram-подарков не подключены.</p></section>';

function updateSale(){
  const p=Number($('priceInput')?.value);
  $('saleSummary').innerHTML=`<div><span>Комиссия (расчёт 5%)</span><b>${p>0?fmt(p*.05):'—'} GRAM</b></div>
    <div><span>После комиссии</span><b>${p>0?fmt(p*.95):'—'} GRAM</b></div>`;
}

function listMine(id){
 const input=$('priceInput'),p=Number(input?.value),x=find(state.mine,id);
 if(!x||!Number.isFinite(p)||p<=0||p>100000000){toast('Укажи корректную цену больше нуля');haptic('error');return;}
 const localListing={id:++state.nid,g:x.g,n:x.n,p:round(p),own:true};state.mk.push(localListing);state.mine=state.mine.filter(y=>y.id!==x.id);
 log('listing',gifts[x.g][1],0,'Лот выставлен · ожидание синхронизации');save();closeSheet();mineTab='listed';setTab('mine');toast('Публикую лот в общий маркет…');
 sharedRequest('rpc/create_market_listing',{method:'POST',body:JSON.stringify({p_gift_name:gifts[x.g][1],p_serial:Number(x.n),p_price:round(p),p_seller_id:sellerId,p_seller_balance:round(state.bal)})}).then(async result=>{
  state.mk=state.mk.filter(y=>String(y.id)!==String(localListing.id));await refreshSharedListings();await refreshSharedWallet();save();render();toast(result?.ok?'Лот опубликован в общем маркете':'Лот опубликован');
 }).catch(e=>{
  console.warn('Listing publish failed:',e);state.mk=state.mk.filter(y=>y.id!==localListing.id);state.mine.push({id:x.id,g:x.g,n:x.n,buy:x.buy||0});log('listing_error',gifts[x.g][1],0,'Публикация не удалась');save();render();toast('Не удалось выставить лот: '+String(e?.message||e).slice(0,100));
 });
}

async function unlist(id){
 const x=find(state.mk,id);if(!x||!x.own)return;
 if(x.shared&&x.dbId){try{await sharedRequest('rpc/cancel_market_listing',{method:'POST',body:JSON.stringify({p_listing_id:Number(x.dbId),p_seller_id:sellerId})});}catch(e){console.warn('Unlist failed:',e);toast('Не удалось снять лот: '+String(e?.message||e).slice(0,100));return;}}
 state.mk=state.mk.filter(y=>String(y.id)!==String(x.id));
 if(!x.shared)state.mine.push({id:++state.nid,g:x.g,n:x.n,buy:x.p});
 log('unlist',gifts[x.g][1],0,'Лот снят с продажи');save();render();toast('Лот снят');
 if(x.shared){await refreshSharedListings();await refreshSharedWallet();}
}

async function doBuy(id){
  const x=find(state.mk,id);
  if(!x||x.own||!Number.isFinite(x.p)||x.p<=0) return;
  if(state.bal<x.p){ toast('Недостаточно средств'); return; }
  if(!x.shared || !x.dbId){ toast('Этот демо-лот нельзя купить между аккаунтами'); return; }
  const buyButton=document.querySelector('[data-buy="'+String(id).replace(/"/g,'')+'"]');
  if(buyButton) buyButton.disabled=true;
  try {
    await sharedRequest('rpc/purchase_market_listing',{
      method:'POST',
      body:JSON.stringify({p_listing_id:Number(x.dbId),p_buyer_id:sellerId,p_buyer_balance:round(state.bal)})
    });
    state.mk=state.mk.filter(y=>String(y.id)!==String(x.id));
    log('buy',gifts[x.g][1],-x.p,'Покупка общего NFT');
    await refreshSharedListings();
    await refreshSharedWallet();
    save(); closeSheet(); render(); haptic('success');
    toast('NFT куплена! Продавцу начислена оплата');
  } catch(e) {
    console.warn('Purchase failed:',e);
    const detail=String(e?.message||e||'Неизвестная ошибка').replace(/\s+/g,' ').slice(0,180);
    toast('Покупка не прошла: '+detail);
    if(buyButton) buyButton.disabled=false;
  }
}

function editListing(id){
  const x=find(state.mk,id);
  if(!x||!x.own) return;

  openSheet(`${art(x.g)}<h2>Изменить цену</h2>
    <div class="desc">${esc(gifts[x.g][1])} · лот #${x.n}</div>
    <label class="inputlabel" for="editPrice">Новая цена в GRAM</label>
    <input id="editPrice" type="number" min="0.01" step="0.01" value="${x.p}">
    <button class="btn" data-saveprice="${x.id}">Сохранить</button>
    <button class="btn secondary" data-close>Отмена</button>`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b) return;
  const d=b.dataset;

  if(b.id==='marketTab') return setTab('market');
  if(b.id==='mineTab') return setTab('mine');
  if(b.id==='playTab'){playMode='';freeTapCount=0;return setTab('play');}
  if(b.id==='profileTab') return setTab('profile');
  if(d.play!==undefined){playMode=d.play;freeTapCount=0;render();return;}
  if(d.playback!==undefined){playMode='';freeTapCount=0;setTab('play');return;}

  if(d.tap!==undefined){freeTapCount=Math.min(20,freeTapCount+1);render();return;}
  if(d.resettap!==undefined){freeTapCount=0;render();return;}
  if(b.id==='theme'){
    state.theme=state.theme==='dark'?'light':'dark';
    save();render();return;
  }

  if(b.id==='balance'){
    openSheet(`<h2>Виртуальный баланс</h2>
      <div class="desc">Это тестовые GRAM внутри демо-приложения. Они не имеют денежной стоимости и не связаны с Telegram Wallet.</div>
      <div class="summary"><div><span>Текущий баланс</span><b>${fmt(state.bal)} GRAM</b></div></div>
      <button class="btn" data-demotopup>Добавить 500 виртуальных GRAM</button>
      <button class="btn secondary" data-close>Закрыть</button>`);
    return;
  }

  if(d.demotopup!==undefined){
    state.bal=round(state.bal+500);
    log('topup','Демо-пополнение',500,'Виртуальные GRAM');
    save();closeSheet();render();haptic('success');
    toast('+500 виртуальных GRAM');
    return;
  }

  if(d.filter){
    filter=d.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>
      x.classList.toggle('active',x===b));
    render();return;
  }

  if(d.fav!==undefined){
    const g=Number(d.fav);
    state.favs=state.favs.includes(g)
      ?state.favs.filter(x=>x!==g)
      :state.favs.concat(g);
    save();render();return;
  }


  if(d.catalogbuy!==undefined){
    const giftIndex=Number(d.catalogbuy);
    const gift=gifts[giftIndex];
    if(!gift){toast('Подарок не найден');return;}
    const price=round(gift[2]);
    if(state.bal<price){toast('Недостаточно виртуальных GRAM');return;}
    state.bal=round(state.bal-price);
    state.mine.unshift({id:++state.nid,g:giftIndex,n:Math.floor(Date.now()/1000),buy:price});
    log('catalog_buy',gift[1],-price,'Добавлено из демо-каталога');
    save();render();haptic('success');toast('Добавлено в демо-коллекцию');return;
  }
  if(d.buy) return confirmBuy(d.buy);
  if(d.confirmbuy) return doBuy(d.confirmbuy);
  if(d.close!==undefined) return closeSheet();
  if(d.sell) return sellSheet(d.sell);
  if(d.list) return listMine(d.list);
  if(d.unlist) return unlist(d.unlist);
  if(d.edit) return editListing(d.edit);

  if(d.saveprice){
    const x=find(state.mk,d.saveprice);
    const p=Number($('editPrice')?.value);
    if(!x||!x.own||!Number.isFinite(p)||p<=0){
      toast('Укажи корректную цену');
      return;
    }
    const newPrice=round(p);
    b.disabled=true;
    b.textContent='Сохраняю…';
    (async()=>{
      try{
        if(x.shared && x.dbId){
          await sharedRequest('rpc/update_market_listing',{
            method:'POST',
            body:JSON.stringify({
              p_listing_id:Number(x.dbId),
              p_seller_id:sellerId,
              p_new_price:newPrice
            })
          });
          await refreshSharedListings();
        }else{
          x.p=newPrice;
          save();
        }
        closeSheet();render();toast('Цена обновлена');
      }catch(err){
        console.warn('Price update failed:',err);
        b.disabled=false;b.textContent='Сохранить';
        toast('Не удалось сохранить цену. Проверь подключение базы и SQL-настройку.');
      }
    })();
    return;
  }

  if(d.minetab){
    mineTab=d.minetab;render();return;
  }

  if(d.clearhistory!==undefined){
    openSheet(`<h2>Очистить историю?</h2>
      <div class="desc">История будет удалена с этого устройства.</div>
      <button class="btn danger" data-confirmclear>Очистить историю</button>
      <button class="btn secondary" data-close>Отмена</button>`);
    return;
  }

  if(d.confirmclear!==undefined){
    state.history=[];
    save();closeSheet();render();toast('История очищена');
  }
});

$('q').addEventListener('input',e=>{
  search=e.target.value.trim().toLowerCase();
  const start=e.target.selectionStart;
  render();
  const next=$('q');
  if(next){next.focus({preventScroll:true});try{next.setSelectionRange(start,start);}catch(_){}}
});

$('sort').addEventListener('change',e=>{
  sort=e.target.value;
  render();
});

$('overlay').addEventListener('click',e=>{
  if(e.target===$('overlay')) closeSheet();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
});

render();

refreshSharedListings();
refreshSharedWallet();
setInterval(() => {
  if (document.visibilityState === 'visible') { refreshSharedListings(); refreshSharedWallet(); }
}, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { refreshSharedListings(); refreshSharedWallet(); }
});
})();
</script>
</body>
</html>
