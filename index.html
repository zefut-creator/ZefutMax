
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091f">
<meta name="description" content="ZefutMax — демо-интерфейс каталога Telegram Gifts. Реальные покупки и передача подарков пока не подключены.">
<meta name="color-scheme" content="dark light">
<title>ZefutMax — Gift Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#10091f;--panel:#21143b;--panel2:#30204f;
  --line:#49316b;--text:#f8f1ff;--muted:#ad9bbf;
  --accent:#ff9f1c;--green:#4ce0a0;--red:#ff8193;
  --gradient:linear-gradient(135deg,#ffad1f,#ff7a18);
  --shadow:0 12px 32px #0003
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5efff;--panel:#fff;--panel2:#eee2ff;
  --line:#d9c4f5;--text:#271536;--muted:#786687;
  --accent:#c66a00;--green:#087b50;--red:#cb304a;
  --gradient:linear-gradient(135deg,#ffbd3d,#ff8a18);
  --shadow:0 12px 32px #4b286010
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  min-height:100vh
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
header{
  position:sticky;top:0;z-index:5;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(16px);
  padding:calc(12px + env(safe-area-inset-top)) 15px 10px;
  border-bottom:1px solid var(--line)
}
.wrap{max-width:1000px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:43px;height:43px;border-radius:14px;
  background:var(--gradient);display:grid;place-items:center;font-size:24px
}
h1{font-size:20px;letter-spacing:-.5px;margin:0}
.subhead{font-size:11px;color:var(--muted)}
.topactions{display:flex;align-items:center;gap:7px}
.iconbtn,.balance{
  border:1px solid var(--line);background:var(--panel);
  color:var(--text);border-radius:13px;padding:9px 11px
}
.iconbtn{width:40px;height:40px;font-size:17px}
.balance{border-radius:999px;font-weight:800;white-space:nowrap}
.balance strong{color:var(--accent)}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:13px}
.searchbox{position:relative;min-width:0}
.searchbox span{position:absolute;left:12px;top:9px;color:var(--muted)}
input,select{
  min-width:0;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px
}
#q{width:100%;padding-left:34px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip,.tab{
  border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:999px;padding:8px 12px;
  font-size:12px;white-space:nowrap
}
.chip.active,.tab.active{
  border-color:var(--accent);background:var(--panel2);color:var(--accent)
}
main{max-width:1000px;margin:auto;padding:18px 15px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.sectionhead h2{font-size:17px;margin:0}
.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{
  min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:9px;display:flex;flex-direction:column;
  transition:transform .15s,border-color .15s
}
.card:active{transform:scale(.985)}
.art{
  position:relative;aspect-ratio:1;border-radius:13px;
  display:grid;place-items:center;overflow:hidden;font-size:50px;
  background:radial-gradient(circle at 25% 15%,#ffffff36,transparent 40%),
  linear-gradient(145deg,#6d35d4,#7f3fe0 52%,#ff9f1c)
}
.art.c1{background:linear-gradient(145deg,#673ad1,#ff9a1f)}
.art.c2{background:linear-gradient(145deg,#8a4de5,#ff941f)}
.art.c3{background:linear-gradient(145deg,#ffad1f,#6d38c4)}
.emoji{filter:drop-shadow(0 5px 7px #0002)}
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px}
.cardtop b{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.fav{border:0;background:transparent;color:var(--muted);font-size:22px;padding:0 2px}
.fav.on{color:var(--red)}
.muted{font-size:11px;color:var(--muted)}
.change{font-size:11px;font-weight:750}
.up{color:var(--green)}.down{color:var(--red)}
.price{font-size:16px;font-weight:850;margin:8px 0}
.price small{font-size:10px;color:var(--muted);font-weight:500}
.btn{
  width:100%;padding:10px 12px;border:0;border-radius:12px;
  background:var(--gradient);color:#35132b;font-weight:850;
  transition:filter .15s,transform .15s
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.card .btn{margin-top:auto}
.note{font-size:11px;line-height:1.55;color:var(--muted);margin:18px 2px}
.demo-banner{max-width:1000px;margin:12px auto 0;padding:10px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);font-size:12px;color:var(--muted)}
.demo-banner strong{color:var(--accent)}
.demo-banner .demo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}
@media(max-width:1030px){.demo-banner{margin-left:15px;margin-right:15px}}
.empty{border:1px dashed var(--line);border-radius:18px;text-align:center;padding:38px 20px;color:var(--muted)}
.empty .big{font-size:35px;margin-bottom:8px}
.listrow{
  display:flex;align-items:center;gap:11px;background:var(--panel);
  border:1px solid var(--line);border-radius:15px;padding:9px;margin-bottom:9px
}
.listrow .art{width:60px;flex:none;font-size:29px}
.listrow .info{flex:1;min-width:0}
.listrow .info b{display:block;font-size:13px}
.listrow .actions{display:flex;flex-direction:column;gap:6px;min-width:85px}
.listrow .btn{font-size:12px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:15px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.stat .label{font-size:11px;color:var(--muted)}
.stat strong{display:block;font-size:16px;margin-top:4px;overflow-wrap:anywhere}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}
.tab{border-radius:11px}
nav{
  position:fixed;z-index:8;bottom:0;left:0;right:0;
  display:flex;justify-content:center;gap:8px;
  background:var(--panel);background:color-mix(in srgb,var(--panel) 95%,transparent);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom))
}
nav button{
  flex:1;max-width:440px;border:0;background:transparent;color:var(--muted);
  border-radius:12px;padding:7px 5px;font-size:12px;font-weight:750
}
nav button .ico{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}
nav button.active{background:var(--panel2);color:var(--accent)}
#overlay{
  position:fixed;inset:0;background:#09030fbb;z-index:20;
  display:none;align-items:flex-end;justify-content:center;padding-top:25px
}
#overlay.open{display:flex}
.sheet{
  width:100%;max-width:540px;max-height:88dvh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);
  border-radius:23px 23px 0 0;padding:19px 17px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow)
}
.handle{width:40px;height:4px;background:var(--line);border-radius:5px;margin:-5px auto 16px}
.sheet .art{width:96px;margin:0 auto 12px}
.sheet h2{text-align:center;font-size:20px;margin:0}
.sheet .desc{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 16px}
.sheet .btn{margin-top:8px}
.sheet .inputlabel{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.sheet input{width:100%}
.summary{background:var(--panel2);border-radius:13px;padding:12px;margin:12px 0;font-size:13px}
.summary div{display:flex;justify-content:space-between;gap:10px;margin:5px 0}
.toast{
  position:fixed;z-index:30;left:50%;top:calc(80px + env(safe-area-inset-top));
  transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:750;font-size:13px;
  box-shadow:var(--shadow);display:none;max-width:90%;text-align:center
}
.toast.show{display:block}
.history{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13px}
.history .detail{color:var(--muted);font-size:11px;margin-top:3px}
.history .amount{font-weight:800;white-space:nowrap}
.positive{color:var(--green)}.negative{color:var(--red)}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{padding:10px}.cardtop b{font-size:14px}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}header{padding-left:22px;padding-right:22px}main{padding-left:22px;padding-right:22px}}
@media(max-width:380px){.balance{padding:8px;font-size:12px}.logo{width:38px;height:38px}.brand{gap:7px}h1{font-size:18px}.listrow .art{width:48px}.listrow .actions{min-width:75px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ZefutMax UI polish */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
body{
  background:
    radial-gradient(ellipse at 50% -15%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 48%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
header{box-shadow:0 8px 28px #00000008}
.brand .logo{
  box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 24%,transparent);
  position:relative;isolation:isolate
}
.brand .logo:after{
  content:"";position:absolute;inset:-3px;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
  border-radius:17px;z-index:-1
}
.iconbtn,.balance,.chip,.tab,nav button,.fav,.btn{
  transition:background-color .18s var(--ease),border-color .18s var(--ease),
    color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s var(--ease)
}
.iconbtn:hover,.balance:hover,.chip:hover,.tab:hover{border-color:var(--accent)}
.card{
  position:relative;overflow:hidden;
  box-shadow:0 5px 16px #00000008;
  animation:card-enter .28s var(--ease) both
}
.card:after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  border:1px solid transparent;transition:border-color .18s var(--ease)
}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 12px 26px #00000016}
.card:hover:after{border-color:color-mix(in srgb,var(--accent) 20%,transparent)}
.art{
  isolation:isolate;
  background-color:var(--panel2);
}
.art:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(circle at 25% 15%,#ffffff38,transparent 42%),
    linear-gradient(145deg,#6d35d4,#7f3fe0 52%,#ff9f1c)
}
.art .emoji{transition:transform .22s var(--ease)}
.card:hover .art .emoji{transform:translateY(-2px) scale(1.06)}
.price{letter-spacing:-.25px}
.btn{box-shadow:0 4px 12px #0000000b}
.btn:not(:disabled):hover{filter:brightness(1.06);box-shadow:0 7px 18px #00000018}
.btn.secondary:hover{border-color:var(--accent);background:var(--panel2)}
.fav:hover{transform:scale(1.12)}
.filters{scroll-padding-inline:15px}
.chip, .tab{min-height:36px}
input,select{transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);outline:none}
#overlay{backdrop-filter:blur(5px);opacity:0;transition:opacity .18s var(--ease)}
#overlay.open{opacity:1}
.sheet{animation:sheet-enter .24s var(--ease) both}
.summary{border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
nav{box-shadow:0 -8px 28px #0000000b}
nav button{min-height:54px}
nav button:active{transform:scale(.97)}
.empty{background:color-mix(in srgb,var(--panel) 48%,transparent)}
.demo-banner{box-shadow:0 5px 18px #00000008}
@keyframes card-enter{from{opacity:.75;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheet-enter{from{transform:translateY(14px);opacity:.8}to{transform:translateY(0);opacity:1}}
@media(hover:none){.card:hover{transform:none;box-shadow:0 5px 16px #00000008}.card:hover .art .emoji{transform:none}}
@media(prefers-reduced-motion:reduce){
  .card,.sheet{animation:none!important}
  #overlay{transition:none!important}
}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">🎁</div>
        <div><h1>ZefutMax</h1><div class="subhead">Telegram Gifts Market</div></div>
      </div>
      <div class="topactions">
        <button class="iconbtn" id="theme" aria-label="Сменить тему">☀️</button>
        <button class="balance" id="balance" title="Виртуальный демо-баланс — нажми, чтобы увидеть пояснение" aria-label="Виртуальный баланс GRAM">
          <strong id="bal">500</strong> <span>GRAM</span> ＋
        </button>
      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="searchbox"><span>⌕</span><input id="q" type="search" placeholder="Найти подарок…" aria-label="Поиск подарка"></div>
      <select id="sort" aria-label="Сортировка">
        <option value="priceUp">Дешевле</option>
        <option value="priceDown">Дороже</option>
        <option value="growth">По росту</option>
        <option value="name">По названию</option>
      </select>
    </div>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">Все подарки</button>
      <button class="chip" data-filter="up">📈 Растут</button>
      <button class="chip" data-filter="down">📉 Падают</button>
      <button class="chip" data-filter="fav">♥ Избранное</button>
    </div>
  </div>
</header>

<div class="demo-banner" role="status"><span class="demo-dot"></span><strong>ДЕМО-РЕЖИМ</strong> · Баланс, цены и операции виртуальные. Реальные платежи и передача подарков не подключены.</div>
<main id="main" class="wrap"></main>

<nav>
  <button id="marketTab" class="active"><span class="ico">🛍️</span>Маркет</button>
  <button id="mineTab"><span class="ico">🎁</span>Мои подарки</button>
  <button id="historyTab"><span class="ico">📊</span>История</button>
</nav>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Детали"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const tg = window.Telegram?.WebApp;

try {
  if(tg){
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#10091f');
    tg.setBackgroundColor('#10091f');
  }
} catch(e) {}

const gifts = [
["🐸","Plush Pepe",6470,-0.5],
["🏆","Intelligence Cup",1560,24.8],
["🏆","Algorithm Cup",1368,3.2],
["💝","Heart Locket",1270,-0.8],
["🐕","Resistance Dog",517.6,-7.6],
["🧢","Durov’s Cap",409.5,-3],
["🙀","Scared Cat",286.3,4.7],
["🍑","Precious Peach",269.5,2.5],
["⛑️","Heroic Helmet",180,1.8],
["🎒","Loot Bag",132.9,0],
["🕶️","Durov’s Glasses",132.9,-1.1],
["💪","Mighty Arm",124.5,0.1],
["💠","Astral Shard",120,-0.6],
["📿","Nail Bracelet",116.6,0.3],
["🤟","Westside Sign",113,3.7],
["🧴","Perfume Bottle",83.3,2.8],
["🏅","Mini Oscar",75.5,3.4],
["🧱","Artisan Brick",73.8,0.8],
["💎","Ion Gem",73,-1.3],
["💍","Gem Signet",65,0.2],
["🚗","Low Rider",62,3],
["🧪","Magic Potion",61.8,0.9],
["⌚","Swiss Watch",59.5,3.4],
["💋","Kissed Frog",49.3,6.2],
["👅","Sharp Tongue",47.7,0.8],
["🔗","Bonded Ring",44.6,2.3],
["🪆","Voodoo Doll",41.5,6.4],
["🐱","Neko Helmet",40,0.2],
["🚬","Vintage Cigar",39.3,-1],
["🪔","Genie Lamp",38,0],
["💍","Signet Ring",35.2,0],
["🧸","Toy Bear",34.3,0],
["💍","Diamond Ring",34,-0.6],
["💀","Electric Skull",30.9,0.7],
["🦜","Rare Bird",29.7,2.4],
["🌹","Eternal Rose",26.4,2.8],
["🎃","Mad Pumpkin",20,9.6],
["💗","Love Potion",14.8,0.7],
["📀","Record Player",11.9,3.9],
["🎩","Top Hat",10,0.1],
["⚔️","Light Sword",6.33,-1.9],
["🎂","Homemade Cake",5.29,3.7],
["🍦","Ice Cream",3.98,1.5],
["🐍","Snake Box",3.63,0]
];

const STORAGE_KEY = 'zefutmax_market_v2';
const round = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const fmt = n => Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

let tab='market', filter='all', mineTab='owned', search='', sort='priceUp';
let toastTimer, state;
let liveCatalog=null, liveCatalogError='', liveCatalogLoading=true;

function seed(){
  let randomSeed=11;
  const rnd=()=>{randomSeed=randomSeed*16807%2147483647;return randomSeed/2147483647};
  let listings=[],id=1;

  gifts.forEach((g,i)=>{
    listings.push({id:id++,g:i,n:Math.floor(rnd()*9000)+100,p:round(g[2])});
    listings.push({id:id++,g:i,n:Math.floor(rnd()*9000)+100,p:round(g[2]*(1.04+rnd()*.1))});
  });

  return {
    bal:500,
    mine:[{id:1000,g:39,n:4521,buy:6.33}],
    mk:listings,
    nid:1001,
    favs:[],
    history:[],
    theme:'dark'
  };
}

function validState(x){
  if(!x || !Number.isFinite(x.bal) || x.bal<0 ||
    !Array.isArray(x.mk) || !Array.isArray(x.mine) ||
    !Array.isArray(x.favs) || !Array.isArray(x.history) ||
    !['dark','light'].includes(x.theme) ||
    !Number.isFinite(x.nid)) return false;

  const validGift = g => Number.isInteger(g) && g>=0 && g<gifts.length;
  const validListing = item => item && Number.isFinite(item.id) &&
    validGift(item.g) && Number.isFinite(item.n) &&
    Number.isFinite(item.p) && item.p>0;

  return x.mk.every(item => validListing(item) &&
      (item.own===undefined || typeof item.own==='boolean')) &&
    x.mine.every(item => item && Number.isFinite(item.id) &&
      validGift(item.g) && Number.isFinite(item.n)) &&
    x.favs.every(validGift) &&
    x.history.every(item => item && typeof item.name==='string' &&
      Number.isFinite(item.amount) && Number.isFinite(item.at));
}

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved=JSON.parse(raw);
      if(validState(saved)) return Object.assign(seed(),saved);
    }
  }catch(e){}
  return seed();
}

state=load();

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){
    toast('Не удалось сохранить данные на устройстве');
  }
}

function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2300);
}

function haptic(type='light'){
  try{
    if(!tg?.HapticFeedback) return;
    if(type==='success'||type==='error') tg.HapticFeedback.notificationOccurred(type);
    else tg.HapticFeedback.impactOccurred(type);
  }catch(e){}
}

function art(index){
  const g=gifts[index];
  return `<div class="art c${index%4}" aria-label="${esc(g[1])}">
    <span class="emoji">${g[0]}</span>
  </div>`;
}

function change(index){
  const n=gifts[index][3];
  const cls=n>0?'up':n<0?'down':'';
  const arrow=n>0?'▲ ':n<0?'▼ ':'';
  return `<span class="change ${cls}">${arrow}${Math.abs(n)}%</span>`;
}

function log(type,name,amount,detail=''){
  state.history.unshift({
    type,name,amount:round(amount),detail,at:Date.now()
  });
  state.history=state.history.slice(0,100);
}

function setTab(next){
  tab=next;
  $('marketTab').classList.toggle('active',next==='market');
  $('mineTab').classList.toggle('active',next==='mine');
  $('historyTab').classList.toggle('active',next==='history');
  $('toolbar').style.display=next==='market'?'grid':'none';
  $('filters').style.display=next==='market'?'flex':'none';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function empty(icon,title,desc){
  return `<div class="empty"><div class="big">${icon}</div>
    <b>${esc(title)}</b><div style="margin-top:6px;font-size:12px">${esc(desc)}</div></div>`;
}

function card(x){
  const g=gifts[x.g];
  const isFav=state.favs.includes(x.g);
  return `<article class="card">
    ${art(x.g)}
    <div class="cardtop">
      <b>${esc(g[1])}</b>
      <button class="fav ${isFav?'on':''}" data-fav="${x.g}"
        aria-label="${isFav?'Убрать из избранного':'В избранное'}">${isFav?'♥':'♡'}</button>
    </div>
    <div class="muted">Лот #${x.n} · ${change(x.g)}</div>
    <div class="price">${fmt(x.p)} <small>GRAM</small></div>
    ${x.own
      ? '<button class="btn secondary" data-unlist="'+x.id+'">Снять лот</button>'
      : '<button class="btn" data-buy="'+x.id+'">Купить</button>'}
  </article>`;
}

function renderLiveCatalog(){
  if(liveCatalogLoading) return '<div class="note">Загружаем официальный каталог Telegram…</div>';
  if(!liveCatalog) return '<div class="note">Официальный каталог пока недоступен. '+esc(liveCatalogError||'Проверь настройку TELEGRAM_BOT_TOKEN в Vercel.')+'</div>';
  if(!liveCatalog.length) return '<div class="note">Telegram не вернул доступных подарков.</div>';
  return '<div class="sectionhead" style="margin-top:28px"><h2>Официальные подарки Telegram</h2><span class="count">'+liveCatalog.length+' типов · цены в Stars</span></div>'+
    '<div class="grid">'+liveCatalog.map(g=>{
      const visual=g.stickerFileId && g.stickerType==='static'
        ? '<img src="/api/gift-image?file_id='+encodeURIComponent(g.stickerFileId)+'" alt="Стикер подарка Telegram" loading="lazy" style="width:100%;height:100%;object-fit:contain;padding:18px" onerror="this.style.display=\'none\'">'
        : '<span class="emoji">🎁</span>';
      const stock=g.remainingCount!==null?'Осталось: '+fmt(g.remainingCount):'Доступен у бота';
      return '<article class="card"><div class="art">'+visual+'</div><div class="cardtop"><b>'+esc(g.stickerEmoji||'Telegram Gift')+'</b></div><div class="muted">'+esc(stock)+(g.premiumOnly?' · Premium':'')+'</div><div class="price">'+fmt(g.stars)+' <small>Stars</small></div><button class="btn secondary" data-giftinfo="'+esc(g.id)+'">Подробнее</button></article>';
    }).join('')+'</div><p class="note">Данные из официального Telegram Bot API. Это подарки, которые бот может отправлять, а не лоты вторичного рынка. Покупка и отправка через этот каталог пока не включены.</p>';
}

function renderMarket(){
  let list=state.mk.filter(x=>gifts[x.g][1].toLowerCase().includes(search));

  if(filter==='up') list=list.filter(x=>gifts[x.g][3]>0);
  if(filter==='down') list=list.filter(x=>gifts[x.g][3]<0);
  if(filter==='fav') list=list.filter(x=>state.favs.includes(x.g));

  list.sort((a,b)=>{
    if(sort==='priceDown') return b.p-a.p;
    if(sort==='growth') return gifts[b.g][3]-gifts[a.g][3]||a.p-b.p;
    if(sort==='name') return gifts[a.g][1].localeCompare(gifts[b.g][1]);
    return a.p-b.p;
  });

  return `<div class="sectionhead">
    <h2>Подарки на маркете</h2><span class="count">${list.length} лотов</span>
  </div>
  ${list.length?'<div class="grid">'+list.map(card).join('')+'</div>':
    empty('🔎','Ничего не найдено','Измени запрос или фильтр.')}
  <p class="note">Демо-режим: каталог, цены и изменение за 24 часа — примеры.
  Баланс и операции сохраняются только в этом браузере. Реальные платежи и
  передача Telegram-подарков не подключены.</p>`+renderLiveCatalog();
}

function renderMine(){
  const total=state.mine.length;
  const listings=state.mk.filter(x=>x.own);
  const value=state.mine.reduce((sum,x)=>sum+(Number(gifts[x.g]?.[2])||0),0);
  let body='';

  if(mineTab==='owned'){
    body=total?state.mine.map(x=>`
      <div class="listrow">
        ${art(x.g)}
        <div class="info"><b>${esc(gifts[x.g][1])}</b>
          <div class="muted">#${x.n} · ориентир ${fmt(gifts[x.g][2])} GRAM</div>
        </div>
        <div class="actions"><button class="btn" data-sell="${x.id}">Продать</button></div>
      </div>`).join(''):
      empty('🎁','Подарков пока нет','Добавь подарок в коллекцию из маркета.');
  }else{
    body=listings.length?listings.map(x=>`
      <div class="listrow">
        ${art(x.g)}
        <div class="info"><b>${esc(gifts[x.g][1])}</b>
          <div class="muted">#${x.n} · ${fmt(x.p)} GRAM</div>
        </div>
        <div class="actions">
          <button class="btn secondary" data-edit="${x.id}">Изменить</button>
          <button class="btn danger" data-unlist="${x.id}">Снять лот</button>
        </div>
      </div>`).join(''):
      empty('🏷️','Нет активных лотов','Твои выставленные лоты появятся здесь.');
  }

  return `<div class="sectionhead"><h2>Мои подарки</h2><span class="count">${total} шт.</span></div>
    <div class="stats">
      <div class="stat"><div class="label">В коллекции</div><strong>${total}</strong></div>
      <div class="stat"><div class="label">Оценка по каталогу</div><strong>${fmt(value)}</strong><div class="muted">GRAM</div></div>
      <div class="stat"><div class="label">Мои лоты</div><strong>${listings.length}</strong></div>
    </div>
    <div class="tabs">
      <button class="tab ${mineTab==='owned'?'active':''}" data-minetab="owned">В коллекции</button>
      <button class="tab ${mineTab==='listed'?'active':''}" data-minetab="listed">На продаже</button>
    </div>${body}`;
}

function renderHistory(){
  if(!state.history.length){
    return `<div class="sectionhead"><h2>История операций</h2></div>
      ${empty('📊','Пока нет операций','Твои действия появятся здесь.')}`;
  }

  return `<div class="sectionhead"><h2>История операций</h2>
    <button class="btn secondary" style="width:auto;padding:7px 10px;font-size:12px" data-clearhistory>Очистить</button>
    </div>`+state.history.map(x=>`
      <div class="history">
        <div><b>${esc(x.name)}</b>
          <div class="detail">${esc(x.detail||x.type)} ·
            ${new Date(x.at).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
          </div>
        </div>
        <div class="amount ${x.amount>=0?'positive':'negative'}">
          ${x.amount>0?'+':''}${fmt(x.amount)} GRAM
        </div>
      </div>`).join('');
}

function render(){
  $('bal').textContent=fmt(state.bal);
  document.documentElement.dataset.theme=state.theme;
  document.querySelector('meta[name="theme-color"]')?.setAttribute(
    'content',state.theme==='dark'?'#10091f':'#f5efff');
  $('theme').textContent=state.theme==='dark'?'☀️':'🌙';
  $('theme').setAttribute('aria-label',state.theme==='dark'?'Включить светлую тему':'Включить тёмную тему');
  $('main').innerHTML=tab==='market'?renderMarket():tab==='mine'?renderMine():renderHistory();
}

function find(arr,id){
  return arr.find(x=>String(x.id)===String(id));
}

function openSheet(content){
  $('overlay').innerHTML=`<div class="sheet"><div class="handle"></div>${content}</div>`;
  $('overlay').classList.add('open');
}

function closeSheet(){
  $('overlay').classList.remove('open');
  $('overlay').innerHTML='';
}

function confirmBuy(id){
  const x=find(state.mk,id);
  if(!x||x.own) return;
  const g=gifts[x.g];
  const enough=state.bal>=x.p;

  openSheet(`${art(x.g)}<h2>${esc(g[1])}</h2>
    <div class="desc">Лот #${x.n} · демо-покупка</div>
    <div class="summary">
      <div><span>Цена</span><b>${fmt(x.p)} GRAM</b></div>
      <div><span>Баланс</span><b>${fmt(state.bal)} GRAM</b></div>
      <div><span>Останется</span><b>${fmt(Math.max(0,state.bal-x.p))} GRAM</b></div>
    </div>
    ${enough
      ? `<button class="btn" data-confirmbuy="${x.id}">Подтвердить демо-покупку</button>`
      : `<p style="color:var(--red);font-size:13px">Недостаточно виртуальных средств.</p>`}
    <button class="btn secondary" data-close>Отмена</button>`);
}

function sellSheet(id){
  const x=find(state.mine,id);
  if(!x) return;

  openSheet(`${art(x.g)}<h2>Выставить на продажу</h2>
    <div class="desc">${esc(gifts[x.g][1])}</div>
    <label class="inputlabel" for="priceInput">Цена в GRAM</label>
    <input id="priceInput" type="number" min="0.01" step="0.01"
      inputmode="decimal" value="${gifts[x.g][2]}">
    <div class="summary" id="saleSummary"></div>
    <button class="btn" data-list="${x.id}">Выставить демо-лот</button>
    <button class="btn secondary" data-close>Отмена</button>`);

  $('priceInput').addEventListener('input',updateSale);
  updateSale();
}

function updateSale(){
  const p=Number($('priceInput')?.value);
  $('saleSummary').innerHTML=`<div><span>Комиссия (расчёт 5%)</span><b>${p>0?fmt(p*.05):'—'} GRAM</b></div>
    <div><span>После комиссии</span><b>${p>0?fmt(p*.95):'—'} GRAM</b></div>`;
}

function listMine(id){
  const input=$('priceInput');
  const p=Number(input?.value);
  const x=find(state.mine,id);

  if(!x||!Number.isFinite(p)||p<=0){
    toast('Укажи корректную цену больше нуля');
    haptic('error');
    return;
  }

  state.mine=state.mine.filter(y=>y.id!==x.id);
  state.mk.push({id:++state.nid,g:x.g,n:x.n,p:round(p),own:true});
  log('listing',gifts[x.g][1],0,'Демо-лот выставлен');
  save();
  closeSheet();
  setTab('mine');
  mineTab='listed';
  render();
  toast('Демо-лот выставлен');
}

function unlist(id){
  const x=find(state.mk,id);
  if(!x||!x.own) return;

  state.mk=state.mk.filter(y=>y.id!==x.id);
  state.mine.push({id:++state.nid,g:x.g,n:x.n,buy:x.p});
  log('unlist',gifts[x.g][1],0,'Лот снят с продажи');
  save();
  render();
  toast('Лот снят');
}

function doBuy(id){
  const x=find(state.mk,id);
  if(!x||x.own||!Number.isFinite(x.p)||x.p<=0) return;
  if(state.bal<x.p){
    toast('Недостаточно средств');
    return;
  }

  state.bal=round(state.bal-x.p);
  state.mk=state.mk.filter(y=>y.id!==x.id);
  state.mine.push({id:++state.nid,g:x.g,n:x.n,buy:x.p});
  log('buy',gifts[x.g][1],-x.p,'Демо-покупка');
  save();
  closeSheet();
  render();
  haptic('success');
  toast('Подарок добавлен в демо-коллекцию');
}

function editListing(id){
  const x=find(state.mk,id);
  if(!x||!x.own) return;

  openSheet(`${art(x.g)}<h2>Изменить цену</h2>
    <div class="desc">${esc(gifts[x.g][1])} · лот #${x.n}</div>
    <label class="inputlabel" for="editPrice">Новая цена в GRAM</label>
    <input id="editPrice" type="number" min="0.01" step="0.01" value="${x.p}">
    <button class="btn" data-saveprice="${x.id}">Сохранить</button>
    <button class="btn secondary" data-close>Отмена</button>`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b) return;
  const d=b.dataset;

  if(b.id==='marketTab') return setTab('market');
  if(b.id==='mineTab') return setTab('mine');
  if(b.id==='historyTab') return setTab('history');

  if(b.id==='theme'){
    state.theme=state.theme==='dark'?'light':'dark';
    save();render();return;
  }

  if(b.id==='balance'){
    openSheet(`<h2>Виртуальный баланс</h2>
      <div class="desc">Это тестовые GRAM внутри демо-приложения. Они не имеют денежной стоимости и не связаны с Telegram Wallet.</div>
      <div class="summary"><div><span>Текущий баланс</span><b>${fmt(state.bal)} GRAM</b></div></div>
      <button class="btn" data-demotopup>Добавить 500 виртуальных GRAM</button>
      <button class="btn secondary" data-close>Закрыть</button>`);
    return;
  }

  if(d.demotopup){
    state.bal=round(state.bal+500);
    log('topup','Демо-пополнение',500,'Виртуальные GRAM');
    save();closeSheet();render();haptic('success');
    toast('+500 виртуальных GRAM');
    return;
  }

  if(d.filter){
    filter=d.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>
      x.classList.toggle('active',x===b));
    render();return;
  }

  if(d.fav!==undefined){
    const g=Number(d.fav);
    state.favs=state.favs.includes(g)
      ?state.favs.filter(x=>x!==g)
      :state.favs.concat(g);
    save();render();return;
  }

  if(d.giftinfo){
    const gift=liveCatalog?.find(x=>String(x.id)===String(d.giftinfo));
    if(gift){
      openSheet('<h2>Официальный подарок Telegram</h2><div class="desc">ID: '+esc(gift.id)+'</div><div class="summary"><div><span>Цена отправки ботом</span><b>'+fmt(gift.stars)+' Stars</b></div><div><span>Тип стикера</span><b>'+esc(gift.stickerType)+'</b></div><div><span>Остаток</span><b>'+(gift.remainingCount===null?'Не указан':fmt(gift.remainingCount))+'</b></div></div><p class="note">Это информационная карточка. Реальная покупка или передача не выполняется.</p><button class="btn secondary" data-close>Закрыть</button>');
    }
    return;
  }

  if(d.buy) return confirmBuy(d.buy);
  if(d.confirmbuy) return doBuy(d.confirmbuy);
  if(d.close) return closeSheet();
  if(d.sell) return sellSheet(d.sell);
  if(d.list) return listMine(d.list);
  if(d.unlist) return unlist(d.unlist);
  if(d.edit) return editListing(d.edit);

  if(d.saveprice){
    const x=find(state.mk,d.saveprice);
    const p=Number($('editPrice')?.value);
    if(!x||!x.own||!Number.isFinite(p)||p<=0){
      toast('Укажи корректную цену');
      return;
    }
    x.p=round(p);
    save();closeSheet();render();toast('Цена обновлена');return;
  }

  if(d.minetab){
    mineTab=d.minetab;render();return;
  }

  if(d.clearhistory){
    openSheet(`<h2>Очистить историю?</h2>
      <div class="desc">История будет удалена с этого устройства.</div>
      <button class="btn danger" data-confirmclear>Очистить историю</button>
      <button class="btn secondary" data-close>Отмена</button>`);
    return;
  }

  if(d.confirmclear){
    state.history=[];
    save();closeSheet();render();toast('История очищена');
  }
});

$('q').addEventListener('input',e=>{
  search=e.target.value.trim().toLowerCase();
  render();
});

$('sort').addEventListener('change',e=>{
  sort=e.target.value;
  render();
});

$('overlay').addEventListener('click',e=>{
  if(e.target===$('overlay')) closeSheet();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
});

render();

async function loadLiveCatalog(){
  try{
    const response=await fetch('/api/gifts',{headers:{Accept:'application/json'}});
    const data=await response.json();
    if(!response.ok) throw new Error(data.setup||data.error||'Каталог временно недоступен');
    if(!Array.isArray(data.gifts)) throw new Error('Некорректный ответ каталога');
    liveCatalog=data.gifts;
    liveCatalogError='';
  }catch(error){
    liveCatalog=null;
    liveCatalogError=error?.message||'Не удалось загрузить каталог';
  }finally{
    liveCatalogLoading=false;
    if(tab==='market') render();
  }
}
loadLiveCatalog();
})();
</script>
</body>
</html>
